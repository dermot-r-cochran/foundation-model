[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation-model"
version = "0.1.0"
description = "Epistemic, Experience-Driven Foundation Model for local device or cloud VM deployment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# pytest-cov compares the total with --cov-fail-under at this precision
# (coverage's should_fail_under). At the default 0 a total of 87.62% rounds
# to 88 and passes a ratchet of 88 while the summary prints FAIL; at 2 the
# comparison is exact. Found 2026-10-19.
precision = 2
